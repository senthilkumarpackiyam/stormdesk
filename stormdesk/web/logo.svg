<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="StormDesk">
  <defs>
    <linearGradient id="sd-head" x1="6" y1="12" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="sd-cloud" x1="0" y1="19" x2="0" y2="37" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#9AA1AC"/>
    </linearGradient>
    <linearGradient id="sd-bolt" x1="0" y1="32" x2="0" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="sd-lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.8" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
    <filter id="sd-glow" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- headset: the service desk -->
  <path d="M11 37v-3a21 21 0 0 1 42 0v3" fill="none" stroke="url(#sd-head)" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="5.5" y="33" width="11.5" height="17" rx="5" fill="url(#sd-head)"/>
  <rect x="47" y="33" width="11.5" height="17" rx="5" fill="url(#sd-head)"/>
  <path d="M52.75 50c0 7-5 10-11.5 10H39" fill="none" stroke="url(#sd-head)" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="36.5" cy="60" r="2.8" fill="url(#sd-head)"/>
  <!-- storm cloud inside the headband -->
  <g fill="url(#sd-cloud)" filter="url(#sd-lift)">
    <circle cx="25" cy="31" r="5"/>
    <circle cx="32" cy="26" r="7"/>
    <circle cx="39.5" cy="30" r="5"/>
    <rect x="22" y="29" width="20" height="8" rx="4"/>
  </g>
  <!-- lightning: the storm it handles -->
  <path d="M35.5 32 27 45h5.5l-3 11L39 41.5h-5.5L37 32z" fill="url(#sd-bolt)" stroke="#B45309" stroke-width="0.9"
        stroke-linejoin="round" filter="url(#sd-glow)"/>
</svg>
